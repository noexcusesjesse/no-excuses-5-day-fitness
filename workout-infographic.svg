g calf raise</text><text x="89" y="946" class="little">30 MIN  •  2 ROUNDS  •  10–12 REPS</text><rect x="602" y="673" width="515" height="288" rx="22" fill="white"/><rect x="602" y="673" width="515" height="78" rx="22" fill="#c44d1e"/><rect x="602" y="725" width="515" height="26" fill="#c44d1e"/><text x="626" y="708" class="day">FRI</text><text x="626" y="739" class="focus">FULL-BODY STRENGTH</text><circle cx="631" cy="784" r="7" fill="#d42a2f"/><text x="649" y="791" class="move">Kettlebell goblet squat</text><circle cx="631" cy="821" r="7" fill="#d42a2f"/><text x="649" y="828" class="move">Resistance tube row</text><circle cx="631" cy="858" r="7" fill="#d42a2f"/><text x="649" y="865" class="move">Incline push-up</text><circle cx="631" cy="895" r="7" fill="#d42a2f"/><text x="649" y="902" class="move">KB farmer carry</text><text x="629" y="946" class="little">30 MIN  •  2 ROUNDS  •  10–12 REPS</text><rect x="62" y="981" width="515" height="288" rx="22" fill="white"/><rect x="62" y="981" width="515" height="78" rx="22" fill="#8d3933"/><rect x="62" y="1033" width="515" height="26" fill="#8d3933"/><text x="86" y="1016" class="day">SAT</text><text x="86" y="1047" class="focus">BODYWEIGHT + CONDITIONING</text><circle cx="91" cy="1092" r="7" fill="#d42a2f"/><text x="109" y="1099" class="move">Chair sit-to-stands</text><circle cx="91" cy="1129" r="7" fill="#d42a2f"/><text x="109" y="1136" class="move">Band pull-aparts</text><circle cx="91" cy="1166" r="7" fill="#d42a2f"/><text x="109" y="1173" class="move">Kettlebell deadlift</text><circle cx="91" cy="1203" r="7" fill="#d42a2f"/><text x="109" y="1210" class="move">Standing knee raises</text><text x="89" y="1254" class="little">30 MIN  •  2 ROUNDS  •  10–12 REPS</text><rect x="62" y="1290" width="515" height="144" rx="18" fill="#dbeedd"/><text x="84" y="1334" class="small">THURSDAY: ACTIVE RECOVERY</text><text x="84" y="1370" class="small">No strength workout</text><text x="84" y="1404" class="small">Easy walk • stretch • mobility</text><rect x="602" y="1290" width="515" height="144" rx="18" fill="#fff0d5"/><text x="624" y="1334" class="small">SUNDAY: WALKING ONLY</text><text x="624" y="1370" class="small">Morning 20 + Afternoon 20</text><text x="624" y="1404" class="small">+ Evening 20 = 60 minutes</text><rect x="62" y="1460" width="1055" height="143" rx="18" fill="white"/><text x="85" y="1504" class="small">EACH WORKOUT: 5 MIN WARM-UP + 20 MIN STRENGTH + 5 MIN COOLDOWN</text><text x="85" y="1544" class="small">WALKING GOAL (MON–SAT): 10,000 STEPS OR 90 MINUTES</text><text x="85" y="1576" class="little">Build gradually. Start where you are. Beginner modifications are available.</text><rect x="0" y="1650" width="1200" height="130" fill="#b71924"/><text x="110" y="1730" class="footer">One Step. No Excuses. Let's Start. One!</text></svg>