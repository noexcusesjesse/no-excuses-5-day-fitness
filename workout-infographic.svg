<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1780" viewBox="0 0 1200 1780" role="img" aria-labelledby="t d"><title id="t">No Excuses 5-Day Fitness Program</title><desc id="d">Five 30-minute workouts on Monday, Tuesday, Wednesday, Friday, and Saturday. Thursday active recovery; Sunday three 20-minute walks. Walking target 10,000 steps or 90 minutes Monday through Saturday.</desc><defs><style>.brand{font:900 69px Arial,sans-serif;fill:white;letter-spacing:1px}.title{font:900 57px Arial,sans-serif;fill:white}.strap{font:700 23px Arial,sans-serif;fill:white}.day{font:900 27px Arial,sans-serif;fill:white}.focus{font:700 20px Arial,sans-serif;fill:white}.move{font:600 23px Arial,sans-serif;fill:#18202d}.little{font:700 18px Arial,sans-serif;fill:#5b6470}.small{font:700 22px Arial,sans-serif;fill:#18202d}.footer{font:italic 900 41px Arial,sans-serif;fill:white}</style><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1522"/><stop offset="1" stop-color="#1e2c3b"/></linearGradient><clipPath id="clip"><rect x="60" y="47" width="219" height="254" rx="24"/></clipPath></defs><rect width="1200" height="1780" fill="url(#bg)"/><rect x="0" y="322" width="1200" height="1320" fill="#e6ebf0"/><image x="60" y="47" width="219" height="254" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip)" href="data:image/avif;base64,"/><text x="311" y="112" class="brand">NO EXCUSES</text><text x="311" y="176" class="title">5-DAY FITNESS</text><text x="311" y="242" class="title">PROGRAM</text><rect x="300" y="267" width="848" height="39" rx="9" fill="#d42a2f"/><text x="319" y="295" class="strap">BANDS  •  KETTLEBELLS  •  BODYWEIGHT  •  WALKING</text><rect x="62" y="365" width="515" height="288" rx="22" fill="white"/><rect x="62" y="365" width="515" height="78" rx="22" fill="#d42a2f"/><rect x="62" y="417" width="515" height="26" fill="#d42a2f"/><text x="86" y="400" class="day">MON</text><text x="86" y="431" class="focus">FULL-BODY STRENGTH</text><circle cx="91" cy="476" 